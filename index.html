<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><title>FITPRO V7</title>
<link rel="manifest" href="manifest.json?v=714"><link rel="stylesheet" href="styles.css?v=714">
<style>html,body{margin:0;min-height:100%;background:#07090c;color:#f7f9fb;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}#boot{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0%,rgba(198,255,54,.12),transparent 32%),#07090c}.boot-card{width:min(420px,100%);background:#10151b;border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:28px;text-align:center}.boot-logo{width:58px;height:58px;margin:0 auto 16px;border-radius:18px;background:#c6ff36;color:#0a0d07;display:grid;place-items:center;font-weight:1000}.boot-card h1{margin:0 0 8px}.boot-card p{color:#8e99a6}.boot-error{color:#ffadb4;margin-top:14px;font-size:13px;white-space:pre-wrap}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
</head><body>
<div id="boot"><div class="boot-card"><div class="boot-logo">FP</div><h1>FITPRO</h1><p>Carregando sua experiência de treino...</p><div id="bootError" class="boot-error"></div></div></div>
<div id="app"></div><div id="toast" class="toast hidden"></div>
<script type="module">
const boot=document.querySelector('#boot'),err=document.querySelector('#bootError');
try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if(!window.supabase)throw new Error('biblioteca de conexão não carregou');await import('./js/app.js?v=714');boot.remove();}catch(e){console.error(e);err.textContent='Não foi possível iniciar o FITPRO. '+(e?.message||String(e));}
</script></body></html>
