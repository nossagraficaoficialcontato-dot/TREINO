<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><title>FITPRO V7</title>
<link rel="manifest" href="manifest.json?v=721"><link rel="stylesheet" href="styles.css?v=721">
<style>html,body{margin:0;min-height:100%;background:#07090c;color:#f7f9fb;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}#boot{min-height:100vh;display:grid;place-items:center;padding:24px}.boot-card{width:min(420px,100%);background:#10151b;border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:28px;text-align:center}.boot-logo{width:58px;height:58px;margin:0 auto 16px;border-radius:18px;background:#c6ff36;color:#0a0d07;display:grid;place-items:center;font-weight:1000}.boot-error{color:#ffadb4;margin-top:14px;font-size:13px}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
</head><body>
<div id="boot"><div class="boot-card"><div class="boot-logo">FP</div><h1>FITPRO</h1><p>Iniciando versão estável...</p><div id="bootError" class="boot-error"></div></div></div>
<div id="app"></div><div id="toast" class="toast hidden"></div>
<script>
(function(){
var err=document.getElementById('bootError');
window.addEventListener('error',function(e){if(err)err.textContent='Erro: '+(e.message||'falha desconhecida')});
try{if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})});if('caches'in window)caches.keys().then(function(ks){ks.forEach(function(k){if(k.toLowerCase().indexOf('fitpro')>=0)caches.delete(k)})});}catch(e){}
var login=document.createElement('script');login.src='login-fix.js?v=721';document.body.appendChild(login);
var s=document.createElement('script');s.src='fitpro-v7.bundle.js?v=721';s.onload=function(){if(window.FITPRO_READY){var b=document.getElementById('boot');if(b)b.remove()}};s.onerror=function(){if(err)err.textContent='Não foi possível carregar o aplicativo.'};document.body.appendChild(s);
})();
</script>
</body></html>
