name: Build FITPRO Online

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct FITPRO app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          base64 -d index.html.gz.b64 | gunzip > _site/index.html
          cp manifest.json _site/manifest.json
          cp sw.js _site/sw.js
          test -s _site/index.html
          grep -q "FITPRO Online V6.1" _site/index.html
          echo "FITPRO build OK"
          wc -c _site/index.html

      - name: Upload validated site artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitpro-v6-1-site
          path: _site
          if-no-files-found: error
